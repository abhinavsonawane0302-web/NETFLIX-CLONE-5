    <div id="moviemodal" class="movie-modal">

        <div class="movie-modal-content">

            <form id="movieform" class="mb-5">

                <div class="card text-white">

                    <div class="card-header d-flex justify-content-between bg-danger">

                        <h3 id="modaltitle">Add Movie</h3>

                        <button type="button" class="close text-white" id="closemodalBtn">

                            &times;


                        </button>

                    </div>

                    <div class="card-body">

                        <div class="form-group text-danger">

                            <label for="moviename">Movie Title</label>
                            <input type="text" class="form-control" id="moviename" required>

                        </div>

                        <div class="form-group text-danger">

                            <label for="imgurl">Movie Img Url</label>
                            <input type="url" class="form-control" required id="imgurl">

                        </div>


                        <div class="form-group text-danger">

                            <label for="description">Movie Description</label>
                            <textarea class="form-control" required id="description"></textarea>

                        </div>


                        <div class="form-group text-danger">

                            <label for="rating">Movie Rating</label>
                            <input type="number" class="form-control" required id="rating" min="1" max="10" step="0.5">

                        </div>
                    </div>

                    <div class="card-footer">
                        <div class="justify-content-between d-flex">

                            <button type="submit" class="btn btn-sm btn-outline-danger" id="addmovie">Add Movie</button>
                            <button type="button" class="btn btn-sm btn-outline-danger d-none" id="Updatebtn">Update Movie Info</button>
                            <button type="button" class="btn btn-sm btn-outline-dark" id="Cancel">Cancel</button>

                        </div>

                    </div>

                </div>

            </form>

        </div>

    </div>
